<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration — Examly</title><link rel="stylesheet" href="style.css"></head><body data-guard="student"><header class="site-header"><nav class="navbar"><a class="brand" href="dashboard.html"><span class="brand-mark">✓</span> Examly</a><div class="nav-actions"><a class="btn btn-outline" href="exam.html">← Back to exams</a></div></nav></header><main class="auth-page"><section class="auth-card"><p class="eyebrow">Demo checkout</p><h1>Complete your registration</h1><p>Review your details and choose a demo payment method.</p><div class="notice"><strong id="selectedExams">Selected exams</strong><br><span id="subtotal">₹0</span> subtotal · <span id="discount">₹0</span> discount · <strong id="amount">₹0</strong> total</div><form id="paymentForm"><div class="form-group"><label for="studentName">Student name</label><input id="studentName" type="text" required autocomplete="name"></div><div class="form-group"><label for="studentEmail">Email address</label><input id="studentEmail" type="email" required autocomplete="email"></div><div class="form-group"><label for="paymentMethod">Demo payment method</label><select id="paymentMethod" required><option value="">Choose a method</option><option value="UPI">UPI (demo)</option><option value="Cash">Cash (demo)</option><option value="Card">Card (demo)</option><option value="Net banking">Net banking (demo)</option></select></div><button class="btn btn-primary" type="submit" style="width:100%">Confirm demo registration</button></form><p class="form-note">No payment is processed. This page records a demo registration in this browser only.</p></section></main><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
