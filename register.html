
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Examly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <nav class="navbar">
        <a class="brand" href="index.html">
            <span class="brand-mark">✓</span> Examly
        </a>
        <div class="nav-actions">
            <a class="btn btn-outline" href="index.html">Home</a>
            <a class="btn btn-primary" href="login.html">Sign In</a>
        </div>
    </nav>
</header>

<main class="auth-page">
    <section class="auth-card">
        <p class="eyebrow">Join Examly</p>
        <h1>Create your account</h1>
        <p>Select your role and enter your details below.</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="accountRole">Register as</label>
                <select id="accountRole" name="accountRole" required>
                    <option value="student" selected>Student</option>
                    <option value="faculty">Faculty</option>
                    <option value="admin">Admin</option>
                </select>
                <p class="form-note" id="roleNote">
                    Create your student account.
                </p>
            </div>

            <div class="form-group">
                <label for="name">Full name</label>
                <input
                    id="name"
                    type="text"
                    autocomplete="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone number</label>
                    <div class="phone-input">
                        <span>+91</span>
                        <input
                            id="phone"
                            type="tel"
                            autocomplete="tel"
                            inputmode="numeric"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            placeholder="9876543210"
                            required
                        >
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="college">College / Institution</label>
                <input
                    id="college"
                    type="text"
                    autocomplete="organization"
                    placeholder="Enter your college name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input">
                    <input
                        id="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="6"
                        placeholder="At least 6 characters"
                        required
                    >
                    <button
                        type="button"
                        data-toggle-password="password"
                        aria-label="Show password"
                    >Show</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <div class="password-input">
                    <input
                        id="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Re-enter your password"
                        required
                    >
                    <button
                        type="button"
                        data-toggle-password="confirmPassword"
                        aria-label="Show password"
                    >Show</button>
                </div>
            </div>

            <button
                class="btn btn-primary"
                type="submit"
                style="width:100%"
            >
                Create Account
            </button>
        </form>

        <p class="form-note">
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>

        <p class="form-note">
            Administrator?
            <a href="admin-login.html">Admin sign in</a>
        </p>
    </section>
</main>

<div id="toast" class="toast"></div>

<script src="app.js?v=4"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    var roleSelect = document.getElementById("accountRole");
    var roleNote = document.getElementById("roleNote");
    var form = document.getElementById("registerForm");

    function updateRoleNote() {
        if (roleSelect.value === "student") {
            roleNote.textContent = "Create your student account.";
        } else if (roleSelect.value === "faculty") {
            roleNote.textContent =
                "Create a faculty account. Faculty dashboard access must be configured separately.";
        } else {
            roleNote.textContent =
                "Admin accounts are managed separately. Selecting Admin will open Admin Sign In.";
        }
    }

    roleSelect.addEventListener("change", updateRoleNote);
    updateRoleNote();

    form.addEventListener("submit", function (event) {
        if (roleSelect.value === "admin") {
            event.preventDefault();
            window.location.href = "admin-login.html";
        }
    });
});
</script>

</body>
</html>
