<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Examly</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><nav class="navbar"><a class="brand" href="index.html"><span class="brand-mark">✓</span> Examly</a><div class="nav-actions"><a class="btn btn-outline" href="index.html">← Home</a><a class="btn btn-primary" href="login.html">Sign in</a></div></nav></header><main class="auth-page"><section class="auth-card"><p class="eyebrow">Start learning</p><h1>Create your account</h1><p>Join thousands of students building their future.</p><form id="registerForm"><div class="form-group"><label for="name">Full name</label><input id="name" type="text" autocomplete="name" placeholder="Alex Johnson" required></div><div class="form-row"><div class="form-group"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="form-group"><label for="phone">Phone number</label><div class="phone-input"><span>+91</span><input id="phone" type="tel" autocomplete="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="98765 43210" required></div></div></div><div class="form-row"><div class="form-group"><label for="college">College</label><input id="college" type="text" list="collegeSuggestions" autocomplete="organization" placeholder="Type or choose your college" required><datalist id="collegeSuggestions"><option value="ABC College of Engineering"></option><option value="Global Institute of Technology"></option><option value="National College of Applied Sciences"></option><option value="City Engineering College"></option><option value="Vidyasagar Institute"></option></datalist></div><div class="form-group"><label for="password">Password</label><div class="password-input"><input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="6+ characters" required><button type="button" data-toggle-password="password" aria-label="Show password">Show</button></div></div><div class="form-group"><label for="confirmPassword">Confirm password</label><div class="password-input"><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat password" required><button type="button" data-toggle-password="confirmPassword" aria-label="Show password">Show</button></div></div></div><button class="btn btn-primary" type="submit" style="width:100%">Create account →</button></form><p class="form-note">Already have an account? <a href="login.html">Sign in</a></p></section></main><div id="toast" class="toast"></div><script src="app.js?v=3"></script></body></html>
