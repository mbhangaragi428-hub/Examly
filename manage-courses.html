<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Manage courses — Examly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-guard="admin">
<header class="site-header">
    <nav class="navbar">
        <a class="brand" href="admin-dashboard.html"><span class="brand-mark">✓</span> Examly <small>ADMIN</small></a>
        <button class="nav-toggle" type="button" aria-label="Open menu">☰</button>
        <ul class="nav-links">
            <li><a href="admin-dashboard.html">Overview</a></li>
            <li><a class="active" href="manage-courses.html">Courses</a></li>
            <li><a href="student-progress.html">Student progress</a></li>
            <li><a href="manage-questions.html">Questions</a></li>
            <li><a href="view-students.html">Students</a></li>
            <li><a href="view-payments.html">Payments</a></li>
            <li><a href="admin-results.html">Results</a></li>
        </ul>
        <div class="nav-actions"><a class="btn btn-outline" href="#" data-logout>Sign out</a></div>
    </nav>
</header>
<main class="page">
    <div class="container">
        <div class="dashboard-header">
            <div>
                <p class="eyebrow">Course catalog</p>
                <h1>Manage courses</h1>
                <p class="muted">Add courses, change their details or fees, and remove courses no longer offered.</p>
            </div>
            <a class="btn btn-outline" href="admin-dashboard.html">← Back to dashboard</a>
        </div>
        <p class="notice" id="courseStorageNotice" aria-live="polite"></p>
        <div class="dashboard-grid">
            <section class="panel">
                <div class="panel-header"><h2 id="courseFormTitle">Add a course</h2></div>
                <div class="panel-body">
                    <form id="courseForm">
                        <div class="form-group">
                            <label for="courseName">Course name</label>
                            <input id="courseName" maxlength="100" required placeholder="e.g. Java Programming">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="courseCategory">Category</label>
                                <input id="courseCategory" maxlength="60" required placeholder="e.g. Development">
                            </div>
                            <div class="form-group">
                                <label for="courseDuration">Duration</label>
                                <input id="courseDuration" maxlength="40" required placeholder="e.g. 45 min">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="courseFee">Fee (₹)</label>
                                <input id="courseFee" type="number" min="0" max="10000000" step="1" required>
                            </div>
                            <div class="form-group">
                                <label for="courseIcon">Course icon</label>
                                <input id="courseIcon" maxlength="8" required placeholder="e.g. ☕">
                            </div>
                        </div>
                        <div class="header-actions">
                            <button class="btn btn-primary" type="submit">Add course</button>
                            <button class="btn btn-outline" id="cancelCourseEdit" type="button">Clear form</button>
                        </div>
                    </form>
                </div>
            </section>
            <section class="panel">
                <div class="panel-header">
                    <h2>Available courses</h2>
                    <button class="btn btn-primary" id="startNewCourse" type="button">＋ Add course</button>
                </div>
                <div class="panel-body" id="courseList" aria-live="polite"></div>
            </section>
        </div>
    </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
